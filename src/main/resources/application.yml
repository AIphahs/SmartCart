spring:
  application:
    name: smartcart
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartcart}
    username: ${SPRING_DATASOURCE_USERNAME:smartcart}
    password: ${SPRING_DATASOURCE_PASSWORD:smartcart_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

ocr:
  tessdata-path: ${OCR_TESSDATA_PATH:/usr/share/tesseract-ocr/4.00/tessdata}
  language: fra+eng

upload:
  dir: ${UPLOAD_DIR:./uploads}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.smartcart: INFO
    net.sourceforge.tess4j: WARN
